[project]
name = "agency-intake-kit"
version = "0.0.0"
description = "Validate, reconcile, and report on a newly acquired insurance agency's book of business. Synthetic data only."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "polars",
    "duckdb",
    "pydantic>=2",
    "typer",
    "rich",
    "httpx",
    "openpyxl",
    "faker",
    "pyyaml",
    "jinja2",
    "charset-normalizer",
    "python-dateutil",
]

[project.scripts]
intake = "intake.cli:app"
synth = "synth_agency_data.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agency_schema",
    "src/synth_agency_data",
    "src/jev_client",
    "src/intake",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "faker", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
